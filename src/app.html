<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <meta name="description" content="Studio City tabletop card game PWA" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <title>Studio City</title>
    <script>
      (() => {
        const storageKey = 'studio-city-pages-redirect';
        try {
          const rawRedirect = sessionStorage.getItem(storageKey);
          if (!rawRedirect) return;

          const redirect = JSON.parse(rawRedirect);
          const appBase = String(redirect.appBase ?? '').replace(/\/$/, '');
          const currentPath = window.location.pathname.replace(/\/$/, '');
          if (currentPath !== appBase) return;

          sessionStorage.removeItem(storageKey);
          const route = String(redirect.route ?? '/').startsWith('/')
            ? String(redirect.route ?? '/')
            : `/${redirect.route}`;
          window.history.replaceState(
            null,
            document.title,
            `${appBase}${route}${redirect.search ?? ''}${redirect.hash ?? ''}`,
          );
        } catch {
          sessionStorage.removeItem(storageKey);
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
